name: Bake country-risks.json from S3

# #417 Option C — triggered by the qgi-frontend-bake-trigger Lambda in the
# staging AWS account whenever the pipeline publishes a new
# dashboard/country-risks.json. Pulls the file from S3 via OIDC (read-only
# on the one key), writes to frontend/data/country-risks.json, and opens
# an automated PR against main.

on:
  schedule:
    - cron: '30 6 * * *'
  workflow_dispatch:
    inputs:
      bucket:
        description: "S3 bucket override (defaults to S3_STAGING_BUCKET secret)"
        required: false
        default: ""
      key:
        description: "S3 key"
        required: false
        default: "dashboard/country-risks.json"
      etag:
        description: "S3 ETag for traceability"
        required: false
        default: ""
      message:
        description: "Commit message (override)"
        required: false
        default: ""

jobs:
  bake:
    name: Pull country-risks.json and open PR
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    permissions:
      id-token: write # OIDC to AWS
      contents: write # git commit + push branch
      pull-requests: write # gh pr create

    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ secrets.AWS_STAGING_ACCOUNT_ID }}:role/github-actions-qgi-frontend-s3-read
          aws-region: eu-central-1

      - name: Pull country-risks.json from S3
        env:
          S3_BUCKET: ${{ inputs.bucket || secrets.S3_STAGING_BUCKET }}
          S3_KEY: ${{ inputs.key || 'dashboard/country-risks.json' }}
        run: |
          aws s3 cp \
            "s3://${S3_BUCKET}/${S3_KEY}" \
            data/country-risks.json

      - name: Commit + open PR if changed
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          S3_KEY: ${{ inputs.key || 'dashboard/country-risks.json' }}
          ETAG: ${{ inputs.etag }}
          CUSTOM_MSG: ${{ inputs.message }}
        run: |
          git config user.name  "Amin Al-Ait"
          git config user.email "aminalait.de@gmail.com"

          if git diff --quiet data/country-risks.json; then
            echo "No change in frontend/data/country-risks.json — nothing to commit."
            exit 0
          fi

          default_msg="chore(data): update country-risks.json snapshot"
          if [ -n "$ETAG" ]; then
            default_msg="$default_msg (etag ${ETAG:0:8})"
          fi
          msg="$CUSTOM_MSG"
          if [ -z "$msg" ]; then
            msg="$default_msg"
          fi

          branch="chore/bake-country-risks"
          git fetch origin "$branch" 2>/dev/null || true
          git checkout -B "$branch"
          git add data/country-risks.json
          git commit -m "$msg"
          git push --force-with-lease origin "$branch"

          if gh pr list --head "$branch" --state open --json number --jq '.[0].number' | grep -q .; then
            echo "Open PR already exists for $branch — updated branch in place."
          else
            gh pr create \
              --title "$msg" \
              --body "Automated \`frontend/data/country-risks.json\` snapshot update." \
              --base main \
              --head "$branch"
          fi
