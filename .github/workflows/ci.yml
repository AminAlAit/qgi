name: CI Pipeline

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  lint-and-typecheck:
    name: lint-and-typecheck
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Python linters
        run: |
          python -m pip install --upgrade pip
          pip install ruff mypy types-requests

      - name: Run Ruff & Mypy on Pipeline and ML
        run: |
          ruff format --check pipeline/
          ruff check pipeline/ ml/
          mypy --config-file pyproject.toml pipeline/ ml/

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend dependencies & run TypeScript/ESLint
        working-directory: frontend
        run: |
          npm ci
          npx tsc --noEmit
          npm run lint -- --max-warnings 0

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.8"

      - name: Validate Terraform formatting and 5-Account configurations
        run: |
          terraform fmt -check -recursive infra/
          for env_dir in management environments/staging environments/qa environments/prod; do
            terraform -chdir="infra/${env_dir}" init -backend=false
            terraform -chdir="infra/${env_dir}" validate
          done

  unit-tests:
    name: unit-tests
    runs-on: ubuntu-latest
    env:
      AWS_ACCESS_KEY_ID: "testing"
      AWS_SECRET_ACCESS_KEY: "testing"
      AWS_SECURITY_TOKEN: "testing"
      AWS_SESSION_TOKEN: "testing"
      AWS_DEFAULT_REGION: "eu-central-1"
      AWS_REGION: "eu-central-1"
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Python test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r pipeline/requirements.txt
          pip install -r ml/requirements.txt
          pip install -r data-tools/requirements.txt

      - name: Run Pipeline Moto unit tests
        run: pytest pipeline/tests -q --disable-warnings

      - name: Run ML & Endogenous Compliance unit tests
        run: pytest ml/tests -q -m "not slow" --disable-warnings

      - name: Run Data-Tools schema unit tests
        run: pytest data-tools/tests -q --disable-warnings

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Run Frontend Vitest unit suite
        working-directory: frontend
        run: |
          npm ci
          npx vitest run

  security-audit:
    name: security-audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Audit secret patterns, legacy account isolation & data footprint
        run: |
          if grep -r --include="*.tf" --include="*.tfvars" "207423186738" infra/; then
            echo "Forbidden legacy account ID 207423186738 detected!"
            exit 1
          fi
          if [ -d "frontend/public/data" ]; then
            SIZE_MB=$(du -sm frontend/public/data | cut -f1)
            echo "frontend/public/data footprint: ${SIZE_MB} MB"
            if [ "$SIZE_MB" -gt 35 ]; then
              echo "Asset footprint exceeds 35MB budget!"
              exit 1
            fi
          fi
          if [ -f ".gitattributes" ] && grep -q "filter=lfs" .gitattributes; then
            echo "Git LFS is prohibited!"
            exit 1
          fi
