name: Sync TE fleet vintage from S3

# Triggered by the qgi-recipe-fleet-frontend-sync Lambda in the staging AWS
# account once the AWS-native bake job has written a new vintage to S3.

on:
  workflow_dispatch:
    inputs:
      s3_bucket:
        description: "S3 bucket override (defaults to S3_STAGING_BUCKET secret)"
        required: false
        default: ""
      vintage_s3_prefix:
        description: "S3 prefix for this vintage (must end with /)"
        required: true
      execution_name:
        description: "SFN execution name (used for branch name)"
        required: true
      vintage:
        description: "Human-readable vintage tag (default = execution_name)"
        required: false
        default: ""
      runner:
        description: "Runner label (ubuntu-latest or self-hosted)"
        required: false
        default: "ubuntu-latest"

jobs:
  sync:
    name: Sync vintage and open PR
    runs-on: ${{ inputs.runner || 'ubuntu-latest' }}
    defaults:
      run:
        working-directory: frontend
    permissions:
      id-token: write # OIDC to AWS
      contents: write # git commit + push branch
      pull-requests: write # gh pr create

    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Resolve vintage label
        id: vintage
        run: |
          set -euo pipefail
          vintage="${{ inputs.vintage }}"
          if [ -z "$vintage" ]; then
            vintage="${{ inputs.execution_name }}"
          fi
          slug=$(echo "$vintage" | tr '[:upper:]' '[:lower:]' | tr -c 'a-z0-9' '-' | sed 's/--*/-/g; s/^-//; s/-$//')

          if [ -z "$slug" ]; then
            echo "::error::Empty vintage slug after normalizing inputs.vintage='${{ inputs.vintage }}' / inputs.execution_name='${{ inputs.execution_name }}'"
            exit 1
          fi

          echo "label=$vintage" >> "$GITHUB_OUTPUT"
          echo "slug=$slug" >> "$GITHUB_OUTPUT"

      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ secrets.AWS_STAGING_ACCOUNT_ID }}:role/github-actions-qgi-frontend-te-fleet-sync
          aws-region: eu-central-1

      - name: Sync vintage from S3
        env:
          S3_BUCKET: ${{ inputs.s3_bucket || secrets.S3_STAGING_BUCKET }}
        run: |
          set -euo pipefail
          dest="data/te-fleet-run-${{ steps.vintage.outputs.slug }}"
          echo "Sync s3://${S3_BUCKET}/${{ inputs.vintage_s3_prefix }} -> frontend/$dest"
          mkdir -p "$dest"
          aws s3 sync \
            "s3://${S3_BUCKET}/${{ inputs.vintage_s3_prefix }}" \
            "$dest" \
            --no-progress

          if [ ! -f "$dest/MANIFEST.json" ]; then
            echo "::error::S3 sync produced no MANIFEST.json under frontend/$dest -- bake output incomplete or wrong prefix"
            exit 1
          fi

      - name: Append vintage rows to cross-vintage rank history
        env:
          VINTAGE_SLUG: ${{ steps.vintage.outputs.slug }}
        run: |
          set -euo pipefail
          python3 scripts/append-cross-vintage-rank-history.py

      - name: Configure git
        run: |
          git config user.name  "Amin Al-Ait"
          git config user.email "aminalait.de@gmail.com"

      - name: Commit + push branch
        id: commit
        env:
          SLUG: ${{ steps.vintage.outputs.slug }}
          LABEL: ${{ steps.vintage.outputs.label }}
          VINTAGE_PREFIX: ${{ inputs.vintage_s3_prefix }}
          EXECUTION_NAME: ${{ inputs.execution_name }}
        run: |
          set -euo pipefail
          branch="sync/te-fleet-${SLUG}"
          git checkout -b "$branch"

          git add data/

          if git diff --cached --quiet; then
            echo "No changes to commit -- bake output identical to current main."
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          n_files=$(git diff --cached --name-only | wc -l | tr -d ' ')
          msg="data(te): sync vintage ${LABEL} (${n_files} files)

          Prefix: ${VINTAGE_PREFIX}
          Execution: ${EXECUTION_NAME}
          Vintage: ${LABEL}

          Per run-separation rule: the per-vintage corpus lands at
          frontend/data/te-fleet-run-<slug>/ and the cross-vintage
          rank-history is APPEND-only.

          Generated by qgi-recipe-fleet-frontend-sync"

          git commit -m "$msg"
          git push origin "$branch"
          echo "branch=$branch" >> "$GITHUB_OUTPUT"
          echo "skip=false" >> "$GITHUB_OUTPUT"

      - name: Ensure PR labels exist
        if: steps.commit.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh label create "data" --description "Data file changes" --color "0075CA" 2>/dev/null || true
          gh label create "te-fleet" --description "Trajectory engine fleet sync" --color "5319E7" 2>/dev/null || true

      - name: Open PR
        if: steps.commit.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SLUG: ${{ steps.vintage.outputs.slug }}
          LABEL: ${{ steps.vintage.outputs.label }}
          VINTAGE_PREFIX: ${{ inputs.vintage_s3_prefix }}
          EXECUTION_NAME: ${{ inputs.execution_name }}
          BRANCH: ${{ steps.commit.outputs.branch }}
        run: |
          set -euo pipefail
          body="Triggered by SFN execution \`${EXECUTION_NAME}\` via qgi-recipe-fleet-frontend-sync Lambda.

          **Prefix:** \`${VINTAGE_PREFIX}\`
          **Vintage:** \`${LABEL}\`

          - Per-vintage corpus -> \`frontend/data/te-fleet-run-${SLUG}/\`
          - Cross-vintage rank-history -> \`frontend/data/te-fleet-rank-history.json\` (APPEND-only, with idempotent re-run support)
          "
          gh pr create \
            --title "data(te): sync vintage ${LABEL}" \
            --body "$body" \
            --base main \
            --head "$BRANCH" \
            --label "data" \
            --label "te-fleet"
