# V-Dem country mapping (alpha-3 join target)
# Source of truth for V-Dem ingest (#487, qgi-data/scripts/ingest_vdem.py)
# 
# Strategy: V-Dem provides country_text_id (ISO 3166-1 alpha-3). The ingest
# script joins V-Dem rows against qgi_data.countries.alpha_3. The mapping
# is implicit (alpha-3 = alpha-3). This file enumerates:
#   - explicitly-mapped: the 251 qgi countries with alpha_3 codes
#   - drop: V-Dem alpha-3 codes that must NOT be ingested (historical entities)
#   - watch: alpha-3 codes that may appear in V-Dem but aren't in qgi yet
# 
# Audit: 2026-04-26 (V-Dem v15 not yet downloaded; codes verified against ISO 3166-1)

version: 1
source: "V-Dem v15 Country-Year Dataset"
generated: "2026-04-26"

