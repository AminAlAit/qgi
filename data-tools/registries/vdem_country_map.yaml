# ---------------------------------------------------------------------------
# Drop list: V-Dem may include these codes; the ingest script SILENTLY DROPS them
# (historical entities, dissolved states, non-modern alpha-3).
# ---------------------------------------------------------------------------
drop:
  SUN: "Soviet Union (pre-1991) — successors handled via RUS/UKR/KAZ/etc."
  YUG: "Yugoslavia (pre-1992) — successors handled via SRB/HRV/SVN/MKD/BIH/MNE"
  DDR: "East Germany (pre-1990) — successor: DEU"
  VDR: "Vietnam, Republic of (South, pre-1976) — successor: VNM"
  RVN: "Vietnam, Republic of (alt code) — successor: VNM"
  ZZB: "Zanzibar (pre-1964) — merged into TZA"
  PSG: "Parthian / older — historical"
  BRT: "Brittany — historical"

# ---------------------------------------------------------------------------
# Watch list: alpha-3 codes V-Dem MAY include that aren't in qgi today.
# Ingest script WARNS on encounter (but doesn't fail) — review per-code below.
# ---------------------------------------------------------------------------
watch:
  XKX: "Kosovo (UN code, V-Dem may use this) — qgi does not include Kosovo as of 2026-04-26"
  KOS: "Kosovo (V-Dem alternate) — same as XKX"
  ZNZ: "Zanzibar — V-Dem might emit if using sub-national codes; not in qgi"

